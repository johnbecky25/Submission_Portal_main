openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Abstract Submission Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: abstracts
    description: Abstract submission operations
  - name: reviews
    description: Review operations
  - name: users
    description: User management
  - name: dashboard
    description: Dashboard and analytics
  - name: form-fields
    description: Custom form field management
  - name: programme
    description: Conference programme/agenda management
  - name: tickets
    description: Ticket cross-reference and attendee management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [author, reviewer, admin, reviewer_admin]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /abstracts:
    get:
      operationId: listAbstracts
      tags: [abstracts]
      summary: List abstracts (filtered by role)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, under_review, accepted, rejected, on_hold]
        - name: track
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: integer
        - name: reviewerId
          in: query
          schema:
            type: integer
        - name: country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of abstracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbstractWithDetails"
    post:
      operationId: createAbstract
      tags: [abstracts]
      summary: Create a new abstract submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbstractBody"
      responses:
        "201":
          description: Created abstract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"

  /abstracts/{id}:
    get:
      operationId: getAbstract
      tags: [abstracts]
      summary: Get abstract by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Abstract with all details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAbstract
      tags: [abstracts]
      summary: Update abstract (author for draft, admin for any)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAbstractBody"
      responses:
        "200":
          description: Updated abstract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"
    delete:
      operationId: deleteAbstract
      tags: [abstracts]
      summary: Delete abstract (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /abstracts/{id}/submit:
    post:
      operationId: submitAbstract
      tags: [abstracts]
      summary: Submit a draft abstract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted abstract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"

  /abstracts/{id}/status:
    patch:
      operationId: updateAbstractStatus
      tags: [abstracts]
      summary: Update abstract status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusBody"
      responses:
        "200":
          description: Updated abstract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"

  /abstracts/{id}/assign:
    post:
      operationId: assignReviewers
      tags: [abstracts]
      summary: Assign reviewers to abstract (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignReviewersBody"
      responses:
        "200":
          description: Assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"

  /abstracts/{id}/auto-assign:
    post:
      operationId: autoAssignReviewers
      tags: [abstracts]
      summary: Auto-assign reviewers based on load balancing (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auto-assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbstractWithDetails"

  /abstracts/bulk-download:
    post:
      operationId: bulkDownloadAbstracts
      tags: [abstracts]
      summary: Bulk download abstracts as CSV metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDownloadBody"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /abstracts/{id}/messages:
    get:
      operationId: listMessages
      tags: [abstracts]
      summary: List messages for a submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [abstracts]
      summary: Send a message on a submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /abstracts/{id}/messages/{messageId}/read:
    patch:
      operationId: markMessageRead
      tags: [abstracts]
      summary: Mark a message as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /abstracts/{id}/speaker:
    get:
      operationId: getSpeaker
      tags: [abstracts]
      summary: Get speaker registration for an accepted submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Speaker record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speaker"
        "404":
          description: No speaker registered
    post:
      operationId: registerSpeaker
      tags: [abstracts]
      summary: Register a speaker for an accepted submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpeakerBody"
      responses:
        "201":
          description: Speaker registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speaker"
    patch:
      operationId: updateSpeaker
      tags: [abstracts]
      summary: Update speaker profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpeakerBody"
      responses:
        "200":
          description: Updated speaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speaker"

  /abstracts/{id}/versions:
    get:
      operationId: listAbstractVersions
      tags: [abstracts]
      summary: List version history for a submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbstractVersion"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews (reviewer sees own, admin sees all)
      parameters:
        - name: abstractId
          in: query
          schema:
            type: integer
        - name: reviewerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewWithDetails"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review for an abstract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewWithDetails"

  /reviews/{id}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: Get review by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewWithDetails"
    patch:
      operationId: updateReview
      tags: [reviews]
      summary: Update a review (reviewer can update own pending review)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewBody"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewWithDetails"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      parameters:
        - name: country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /dashboard/reviewer-workload:
    get:
      operationId: getReviewerWorkload
      tags: [dashboard]
      summary: Get reviewer workload distribution
      parameters:
        - name: country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Reviewer workload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewerWorkload"

  /dashboard/speaker-payment-stats:
    get:
      operationId: getDashboardSpeakerPaymentStats
      tags: [dashboard]
      summary: Get speaker payment status stats (cross-referenced with ticket data)
      responses:
        "200":
          description: Speaker payment stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerPaymentStats"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [dashboard]
      summary: List audit logs (admin only)
      parameters:
        - name: abstractId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /form-fields:
    get:
      operationId: listFormFields
      tags: [form-fields]
      summary: List all form fields (active and inactive)
      responses:
        "200":
          description: List of form fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormField"
    post:
      operationId: createFormField
      tags: [form-fields]
      summary: Create a new custom form field (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormFieldBody"
      responses:
        "201":
          description: Created form field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormField"

  /form-fields/reorder:
    post:
      operationId: reorderFormFields
      tags: [form-fields]
      summary: Reorder form fields (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFormFieldsBody"
      responses:
        "200":
          description: Reordered fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormField"

  /form-fields/{id}:
    patch:
      operationId: updateFormField
      tags: [form-fields]
      summary: Update a custom form field (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFormFieldBody"
      responses:
        "200":
          description: Updated form field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormField"
    delete:
      operationId: deleteFormField
      tags: [form-fields]
      summary: Delete a custom form field (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /abstracts/{id}/field-values:
    get:
      operationId: getAbstractFieldValues
      tags: [abstracts]
      summary: Get custom field values for an abstract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Field values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbstractFieldValue"
    post:
      operationId: saveAbstractFieldValues
      tags: [abstracts]
      summary: Save custom field values for an abstract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAbstractFieldValuesBody"
      responses:
        "200":
          description: Saved field values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbstractFieldValue"

  /tickets/upload:
    post:
      operationId: uploadTicketCsv
      tags: [tickets]
      summary: Upload Zoho Backstage CSV and store attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName: { type: string }
                emailCol: { type: string }
                nameCol: { type: string }
                ticketTypeCol: { type: string }
                statusCol: { type: string }
                paymentStatusCol: { type: string }
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
              required: [fileName, emailCol, rows]
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketSyncMeta"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/drive-headers:
    get:
      operationId: getTicketDriveHeaders
      tags: [tickets]
      summary: Fetch CSV column headers from a public Google Drive URL
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Column headers detected
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: array
                    items:
                      type: string
                  rowCount:
                    type: integer
                  fileName:
                    type: string
                required: [headers, rowCount, fileName]
        "400":
          description: Bad URL or not a CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/sync-drive:
    post:
      operationId: syncTicketsFromDrive
      tags: [tickets]
      summary: Fetch and sync CSV from a public Google Drive URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driveUrl: { type: string }
                emailCol: { type: string }
                nameCol: { type: string }
                ticketTypeCol: { type: string }
                statusCol: { type: string }
                paymentStatusCol: { type: string }
              required: [driveUrl, emailCol]
      responses:
        "200":
          description: Sync successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketSyncMeta"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/summary:
    get:
      operationId: getTicketSummary
      tags: [tickets]
      summary: Get ticket cross-reference summary and stats
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketSummary"
        "204":
          description: No data yet
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /programme/sessions:
    get:
      operationId: listProgrammeSessions
      tags: [programme]
      summary: List all programme sessions with speakers (public)
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgrammeSession"
    post:
      operationId: createProgrammeSession
      tags: [programme]
      summary: Create a new session (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgrammeSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammeSession"

  /programme/sessions/{id}:
    patch:
      operationId: updateProgrammeSession
      tags: [programme]
      summary: Update a session (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgrammeSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammeSession"
    delete:
      operationId: deleteProgrammeSession
      tags: [programme]
      summary: Delete a session (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /programme/sessions/{id}/speakers:
    post:
      operationId: addSessionSpeaker
      tags: [programme]
      summary: Add a speaker to a session (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionSpeakerBody"
      responses:
